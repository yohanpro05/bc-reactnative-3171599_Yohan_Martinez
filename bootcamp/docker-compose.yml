services:
  app: # Este es el nombre del servicio
    build: .
    user: "${MY_UID}:${GID}"
    volumes:
      - .:/app
      - pnpm_store:/root/.local/share/pnpm/store
      - /app/node_modules
    ports:
      - "8081:8081"
      - "19000:19000"
    environment:
      - EXPO_DEVTOOLS_LISTEN_ADDRESS=0.0.0.0
      - REACT_NATIVE_PACKAGER_HOSTNAME=${REACT_NATIVE_PACKAGER_HOSTNAME}
    stdin_open: true
    tty: true

volumes:
  pnpm_store: